<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VGC.to — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #080808;
    --surface: #0f0f0f;
    --border: #1c1c1c;
    --blue: #0056EB;
    --blue-bright: #1a6fff;
    --orange: #ED832B;
    --text: #f0f0f0;
    --muted: #666;
    --muted2: #2a2a2a;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .bg-grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,86,235,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,86,235,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }
  .glow-orange {
    position: fixed; width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(237,131,43,0.07) 0%, transparent 70%);
    bottom: -200px; left: -100px; pointer-events: none;
  }
  .glow-blue {
    position: fixed; width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,86,235,0.09) 0%, transparent 70%);
    top: -150px; right: -100px; pointer-events: none;
  }
  .login-wrap {
    position: relative; width: 420px;
    animation: fadeUp 0.5s ease;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .logo-area { text-align: center; margin-bottom: 36px; }
  .logo-row { display: inline-flex; align-items: center; gap: 14px; }
  .globe-icon { width: 52px; height: 52px; }
  .logo-text-col { display: flex; flex-direction: column; align-items: flex-start; }
  .logo-vgc {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 2.6rem; font-weight: 800;
    color: var(--blue); letter-spacing: -1px; line-height: 1;
  }
  .logo-sub {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.7rem; font-weight: 600;
    letter-spacing: 4px; text-transform: uppercase;
    color: var(--orange); margin-top: 3px;
  }
  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px; padding: 40px;
    position: relative; overflow: hidden;
  }
  .login-card::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--blue), var(--orange));
  }
  .card-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem; font-weight: 600;
    letter-spacing: 4px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 28px;
  }
  .field { margin-bottom: 20px; }
  label {
    display: block; font-size: 0.68rem; font-weight: 600;
    letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 7px;
  }
  input {
    width: 100%; background: var(--bg);
    border: 1px solid var(--muted2); border-radius: 2px;
    padding: 12px 16px; color: var(--text);
    font-family: 'Barlow', sans-serif; font-size: 0.95rem;
    transition: border-color 0.2s, box-shadow 0.2s; outline: none;
  }
  input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(0,86,235,0.1);
  }
  .btn {
    width: 100%; padding: 13px;
    background: var(--blue); border: none; border-radius: 2px;
    color: white; font-family: 'Barlow Condensed', sans-serif;
    font-size: 1rem; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; cursor: pointer;
    transition: background 0.2s; margin-top: 8px;
  }
  .btn:hover { background: var(--blue-bright); }
  .error {
    background: rgba(237,131,43,0.08);
    border: 1px solid rgba(237,131,43,0.25);
    border-radius: 2px; padding: 10px 14px;
    color: var(--orange); font-size: 0.85rem; margin-bottom: 20px;
  }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="glow-orange"></div>
<div class="glow-blue"></div>
<div class="login-wrap">
  <div class="logo-area">
    <div class="logo-row">
      <svg class="globe-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="19" stroke="#ED832B" stroke-width="2.5"/>
        <ellipse cx="24" cy="24" rx="9.5" ry="19" stroke="#ED832B" stroke-width="2.5"/>
        <line x1="5" y1="24" x2="43" y2="24" stroke="#ED832B" stroke-width="2.5"/>
        <path d="M7 15 Q24 21 41 15" stroke="#ED832B" stroke-width="2" fill="none"/>
        <path d="M7 33 Q24 27 41 33" stroke="#ED832B" stroke-width="2" fill="none"/>
      </svg>
      <div class="logo-text-col">
        <span class="logo-vgc">VGC</span>
        <span class="logo-sub">URL Shortener</span>
      </div>
    </div>
  </div>
  <div class="login-card">
    <div class="card-title">Sign In to Dashboard</div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="field">
        <label>Username</label>
        <input type="text" name="username" autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Sign In</button>
    </form>
  </div>
</div>
</body>
</html>
