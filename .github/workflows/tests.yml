name: Tests

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - run: python -m unittest -v test_og_metadata.py test_app.py
        working-directory: app
        env:
          DATABASE_URL: 'sqlite:///:memory:'

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure restricted deployment key
        env:
          DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/vgc-production-deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vgc-production-deploy ~/.ssh/known_hosts
      - name: Deploy tested main commit
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
        run: |
          ssh -i ~/.ssh/vgc-production-deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            vgcdeploy@"$DEPLOY_HOST"
